name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Default env: indexing switch off, so this is the preview/staging variant of the build.
      - run: npm run build

  e2e:
    name: Playwright (two production builds, desktop + mobile + kill switch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # playwright.config.ts uses the installed Google Chrome locally and the
      # downloaded Chromium when CI is set (PLAYWRIGHT_CHANNEL stays unset here).
      - run: npx playwright install --with-deps chromium
      # e2e/serve-builds.mjs builds the indexed and noindex variants, then serves them.
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  seo-audit:
    name: SEO audit (indexed build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The audit needs the indexed variant (sitemaps are only generated when indexing is on).
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://timenow.example
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
          TIMENOW_DIST_DIR: .next-audit
      - run: node scripts/seo/audit-site.mts --dist .next-audit --site-url https://timenow.example
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo-audit
          path: seo/reports
          retention-days: 30
